name: Build Windows Installer

# 触发方式：仅网页手动按钮（Actions 页 → Run workflow）
# 每次触发必须填写版本号，无默认值，避免误用 0.1.0
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "版本号（用于生成 Tag，如 0.1.0、0.2.0）"
        required: true
      is_pre_release:
        description: "是否预发布"
        type: boolean
        default: false

permissions:
  contents: write   # 创建 tag 和 release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version env
        shell: pwsh
        env:
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          INPUT_IS_PRE_RELEASE: ${{ inputs.is_pre_release }}
        run: |
          if (-not $env:INPUT_APP_VERSION) {
            Write-Error "必须填写版本号（app_version）"
            exit 1
          }
          $pre = if ($env:INPUT_IS_PRE_RELEASE -eq "true") { "true" } else { "false" }
          $short = $env:GITHUB_SHA.Substring(0, 7)
          echo "APP_VERSION=$env:INPUT_APP_VERSION" >> $env:GITHUB_ENV
          echo "COMMIT_SHORT=$short" >> $env:GITHUB_ENV
          echo "IS_PRE_RELEASE=$pre" >> $env:GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Commit: $env:COMMIT_SHORT"
          Write-Host "Version: $env:APP_VERSION"
          rustc --version
          cargo --version
          flutter --version

      - name: Build Rust backend
        shell: pwsh
        run: |
          Set-Location backend
          cargo build --release
          if (-not (Test-Path target\release\hyrwbz_backend.exe)) { throw "后端编译失败" }

      - name: Build Flutter frontend
        shell: pwsh
        run: |
          Set-Location frontend
          # 强制生成/覆盖 Windows 平台文件（flutter create 在已有项目上不会自动创建 windows 目录）
          flutter create --platforms=windows --project-name=hyrwbz_frontend --overwrite .
          flutter pub get
          flutter build windows --release
          if (-not (Test-Path build\windows\x64\runner\Release)) { throw "前端编译失败" }

      - name: Stage installer artifacts
        shell: pwsh
        run: |
          $dist = "installer\dist"
          New-Item -ItemType Directory -Force -Path "$dist\frontend" | Out-Null
          Copy-Item -Recurse -Force frontend\build\windows\x64\runner\Release\* "$dist\frontend\"
          Copy-Item -Force backend\target\release\hyrwbz_backend.exe "$dist\"
          # 不再需要 run.bat：前端启动时自动拉起后端子进程

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $url = "https://files.jrsoftware.org/is/6/innosetup-6.4.3.exe"
            $installer = "$env:TEMP\inno-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          }
          if (-not (Test-Path $isccPath)) { throw "Inno Setup 安装失败" }
          Write-Host "Inno Setup 已就绪: $isccPath"

      - name: Build installer
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $issPath = Join-Path $root "installer\hyrwbz.iss"
          Write-Host "ISCC: $isccPath"
          Write-Host "ISS:  $issPath"
          Write-Host "Exists: $(Test-Path $issPath)"
          if (-not (Test-Path $issPath)) { throw "找不到 .iss 文件: $issPath" }
          Set-Location $root
          & $isccPath $issPath
          Get-ChildItem (Join-Path $root "build\installer") -Filter *.exe | Format-List FullName

      - name: Compute tag
        id: tag
        shell: pwsh
        run: |
          $tag = "v$env:APP_VERSION-$env:COMMIT_SHORT"
          Write-Host "Tag = $tag"
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyrwbz-installer-${{ steps.tag.outputs.TAG }}
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: HYRWBZ ${{ steps.tag.outputs.TAG }}
          body: |
            会议任务管理跟踪系统 (HYRWBZ) Windows 安装包
            - 版本: ${{ steps.tag.outputs.TAG }}
            - 兼容: Windows 10 / Windows 11
            - 构建: ${{ env.COMMIT_SHORT }}
            - 安装: 下载 .exe 双击安装即可
          prerelease: ${{ env.IS_PRE_RELEASE == 'true' }}
          files: build/installer/*.exe
