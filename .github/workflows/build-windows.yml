name: Build Windows

on:
  # main 分支每次 push 都会构建并自动发布下一个版本；手动推送版本 tag 仍可构建指定版本。
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "设定版本号（留空则根据最新 tag 自动加 0.0.1）"
        required: false
        type: string
      is_pre_release:
        description: "是否预发布"
        type: boolean
        default: false

permissions:
  contents: write

# 自动版本号依赖最新 tag；串行执行可避免连续 push 计算出相同版本。
concurrency:
  group: build-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 自动推算版本时需要读取完整 tag 历史。
          fetch-depth: 0

      - name: Resolve version
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IS_PRE_RELEASE: ${{ inputs.is_pre_release }}
          RELEASE_IS_PRE_RELEASE: ${{ github.event.release.prerelease }}
        run: |
          function Get-NextVersion {
            $versions = @(
              git tag --list 'v*.*.*' | ForEach-Object {
                if ($_ -match '^v([0-9]+)\.([0-9]+)\.([0-9]+)$') {
                  [pscustomobject]@{
                    Major = [int]$matches[1]
                    Minor = [int]$matches[2]
                    Patch = [int]$matches[3]
                  }
                }
              }
            )
            if ($LASTEXITCODE -ne 0) {
              throw '读取 Git tag 失败'
            }

            if ($versions.Count -eq 0) {
              return '0.0.1'
            }

            $latest = $versions |
              Sort-Object -Property `
                @{ Expression = { $_.Major }; Descending = $true }, `
                @{ Expression = { $_.Minor }; Descending = $true }, `
                @{ Expression = { $_.Patch }; Descending = $true } |
              Select-Object -First 1

            $major = $latest.Major
            $minor = $latest.Minor
            $patch = $latest.Patch + 1
            if ($patch -ge 10) {
              $patch = 0
              $minor++
            }
            if ($minor -ge 10) {
              $minor = 0
              $major++
            }
            return "$major.$minor.$patch"
          }

          $inputVersion = ($env:INPUT_VERSION ?? '').Trim()
          switch ($env:EVENT_NAME) {
            'push' {
              if ($env:REF_TYPE -eq 'tag') {
                $rawVersion = $env:REF_NAME
                $versionSource = 'push tag'
              } else {
                $rawVersion = Get-NextVersion
                $versionSource = 'latest tag + 0.0.1'
              }
            }
            'release' {
              $rawVersion = $env:RELEASE_TAG
              $versionSource = 'published release'
            }
            'workflow_dispatch' {
              if ($inputVersion) {
                $rawVersion = $inputVersion
                $versionSource = 'manual input'
              } else {
                $rawVersion = Get-NextVersion
                $versionSource = 'latest tag + 0.0.1'
              }
            }
            default { throw "不支持的触发事件: $env:EVENT_NAME" }
          }

          $rawVersion = ($rawVersion ?? '').Trim()
          if ($rawVersion -notmatch '^v?([0-9]+)\.([0-9]+)\.([0-9]+)$') {
            throw "版本号格式错误: '$rawVersion'，必须是 X.X.X 或 vX.X.X"
          }
          $version = "$($matches[1]).$($matches[2]).$($matches[3])"
          $tag = "v$version"
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $pre = if ($env:INPUT_IS_PRE_RELEASE -eq 'true') { 'true' } else { 'false' }
          } elseif ($env:EVENT_NAME -eq 'release') {
            $pre = if ($env:RELEASE_IS_PRE_RELEASE -eq 'true') { 'true' } else { 'false' }
          } else {
            $pre = 'false'
          }

          Write-Host "Version source: $versionSource"
          Write-Host "Version: $version"
          Write-Host "Tag: $tag"
          Write-Host "Pre-release: $pre"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "IS_PRE_RELEASE=$pre" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        shell: pwsh
        run: |
          Write-Host "Branch: $env:GITHUB_REF_NAME"
          Write-Host "Version: $env:APP_VERSION"
          rustc --version
          cargo --version
          flutter --version

      - name: Test and build Rust backend (release)
        shell: pwsh
        run: |
          Set-Location backend
          # 测试与最终产物统一使用 release profile，避免先编译 debug 测试、
          # 再重新编译一套 release 依赖。测试和正式文件在同一个步骤完成。
          cargo test --release --all-targets
          cargo build --release
          if (-not (Test-Path target\release\hyrwbz_backend.exe)) { throw "后端编译失败" }

      - name: Build Flutter frontend
        shell: pwsh
        run: |
          Set-Location frontend
          flutter create --platforms=windows --project-name=hyrwbz_frontend --overwrite .
          git checkout -- lib/ test/ pubspec.yaml
          # flutter create 会生成模板测试；仓库没有跟踪该文件，checkout 不会删除它。
          Remove-Item -Force test\widget_test.dart -ErrorAction SilentlyContinue
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release
          if (-not (Test-Path build\windows\x64\runner\Release)) { throw "前端编译失败" }

      - name: Stage installer artifacts
        shell: pwsh
        run: |
          $dist = "installer\dist"
          New-Item -ItemType Directory -Force -Path "$dist\frontend" | Out-Null
          Copy-Item -Recurse -Force frontend\build\windows\x64\runner\Release\* "$dist\frontend\"
          Copy-Item -Force backend\target\release\hyrwbz_backend.exe "$dist\"

      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          $portableDir = "build\portable\hyrwbz_portable_$ver"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          # Flutter 前端产物（exe + dll + data）和 Rust 后端放在同一目录
          Copy-Item -Recurse -Force frontend\build\windows\x64\runner\Release\* "$portableDir\"
          Copy-Item -Force backend\target\release\hyrwbz_backend.exe "$portableDir\"
          Compress-Archive -Path $portableDir -DestinationPath "build\portable\hyrwbz_portable_$ver.zip" -CompressionLevel Optimal
          Write-Host "Portable zip: build\portable\hyrwbz_portable_$ver.zip"

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $url = "https://files.jrsoftware.org/is/6/innosetup-6.4.3.exe"
            $installer = "$env:TEMP\inno-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer
            Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          }
          if (-not (Test-Path $isccPath)) { throw "Inno Setup 安装失败" }
          Write-Host "Inno Setup 已就绪: $isccPath"

      - name: Build installer
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $issPath = Join-Path $root "installer\hyrwbz.iss"
          Write-Host "ISCC: $isccPath"
          Write-Host "ISS:  $issPath"
          Write-Host "Exists: $(Test-Path $issPath)"
          if (-not (Test-Path $issPath)) { throw "找不到 .iss 文件: $issPath" }
          Set-Location $root
          & $isccPath "/DMyAppVersion=$env:APP_VERSION" $issPath
          Get-ChildItem (Join-Path $root "build\installer") -Filter *.exe | Format-List FullName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyrwbz-installer-${{ steps.tag.outputs.TAG }}
          path: build/installer/*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyrwbz-portable-${{ steps.tag.outputs.TAG }}
          path: build/portable/*.zip
          if-no-files-found: error

      - name: Create or update tag and release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: HYRWBZ ${{ steps.tag.outputs.TAG }}
          body: ${{ steps.tag.outputs.TAG }}
          prerelease: ${{ env.IS_PRE_RELEASE == 'true' }}
          files: |
            build/installer/*.exe
            build/portable/*.zip
